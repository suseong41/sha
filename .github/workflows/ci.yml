name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0" # 매주 일요일 03:00 KST — 긴 퍼징

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt 안 된 파일:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build
        run: go build .

      - name: 스모크 - 정상 페이지에 HIGH 발견 없음
        run: ./sha -min high testdata/jnu_main.html https://www.jnu.ac.kr/

      - name: 스모크 - 악성 샘플에서 HIGH 발견됨
        run: |
          if ./sha -min high testdata/malicious_sample.html https://bank.example.com/; then
            echo "악성 샘플에서 아무것도 못 찾음"
            exit 1
          fi
          echo "정상: 발견되어 종료 코드 1"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 우리 코드가 실제로 호출하는 경로에 알려진 취약점이 있으면 실패한다.
      # 코드가 그대로여도 취약점은 새로 알려지므로, 위의 주간 schedule 에서도 돈다.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./tokenizer
            target: FuzzTokenizer
          - pkg: ./tokenizer
            target: FuzzUnescape
          - pkg: ./scanner
            target: FuzzScan
          - pkg: ./scanner
            target: FuzzPunyDecode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 퍼징 ${{ matrix.target }}
        run: |
          time=30s
          if [ "${{ github.event_name }}" = "schedule" ]; then time=10m; fi
          go test ${{ matrix.pkg }} -run '^$' -fuzz ${{ matrix.target }} -fuzztime $time

      - name: 크래시 입력 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 허용 목록(.dockerignore)에서 패키지가 빠지면 여기서 죽는다 — 배포하는 날이 아니라.
      - name: 이미지 빌드
        run: docker build -t sha:ci .

      # 바깥 사이트를 스캔하지 않는다. 네트워크 사정으로 흔들리는 빨간불은 무시당한다.
      - name: 스모크 - 상태 확인
        run: |
          docker run -d --name sha-ci -p 127.0.0.1:8080:8080 sha:ci
          for i in $(seq 20); do
            body=$(curl -sf http://127.0.0.1:8080/healthz) && break
            sleep 0.5
          done
          echo "받은 본문: $body"
          [ "$body" = '{"status":"ok"}' ] || { docker logs sha-ci; exit 1; }

      # 시작 로그가 이 이미지가 지금 코드인지 말해 준다 (63 · 65교시).
      - name: 스모크 - 시작 로그에 버전과 상한
        run: |
          docker logs sha-ci 2>&1 | grep -q '"version":"' || { docker logs sha-ci; exit 1; }
          docker logs sha-ci 2>&1 | grep -q '"max_scans":' || { docker logs sha-ci; exit 1; }

  # 우리가 정한 형식이 아니라 남이 정한 형식이라, 남의 검증기로 본다.
  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 빌드
        run: go build -o sha .

      # 발견 있음 · 없음 · 참고만 있음 — 세 모양을 다 낸다.
      - name: SARIF 생성
        run: |
          ./sha -sarif testdata/malicious_sample.html https://bank.example.com/ > bad.sarif || true
          ./sha -sarif testdata/jnu_main.html https://www.jnu.ac.kr/ > clean.sarif || true
          ./sha -sarif testdata/spa_shell.html https://app.example.com/ > spa.sarif || true

      # 커밋으로 고정한다 — 고정 안 한 주소는 아무도 모르는 판을 쓰게 된다 (72교시).
      - name: 공식 스키마 (OASIS SARIF 2.1.0)
        run: |
          curl -fsSL -o sarif-schema.json \
            https://raw.githubusercontent.com/oasis-tcs/sarif-spec/a560296ca8c921f3bdb8d4a8db57ab83dae968a7/sarif-2.1/schema/sarif-schema-2.1.0.json

      # 대조군이 함께 돈다 — 깨뜨린 문서가 실패해야 "통과"가 뜻을 갖는다.
      - name: 스키마 검증
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet jsonschema
          .venv/bin/python tools/validate_sarif.py sarif-schema.json bad.sarif clean.sarif spa.sarif
